<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#4b0b68"><title>Ayyanar Sweets</title>
<style>
:root{--p:#5b0a7a;--p2:#3d0755;--g:#d6ad45;--bg:#f7f4f8;--text:#24172a}*{box-sizing:border-box}body{margin:0;background:#eee;color:var(--text);font-family:Arial,Helvetica,sans-serif}button{font:inherit}.app{max-width:430px;margin:auto;min-height:100vh;background:var(--bg);box-shadow:0 0 30px #aaa}.top{background:linear-gradient(135deg,#30063f,#70108d);color:white;padding:12px 16px 14px;position:sticky;top:0;z-index:10}.toprow{display:flex;align-items:center;gap:10px}.hamb{font-size:25px}.logo{width:150px;height:46px;object-fit:contain;margin:auto}.cart{font-size:23px}.search{background:#fff;border-radius:20px;padding:9px 13px;color:#777;margin-top:10px}.hero{margin:0;background:linear-gradient(135deg,#3d0755,#7c1595);color:white;padding:18px 18px 24px;min-height:185px;position:relative;overflow:hidden}.hero h1{font-family:Georgia,serif;font-size:22px;line-height:1.15;width:55%;margin:10px 0}.hero p{width:55%;opacity:.9}.hero img{position:absolute;right:-25px;bottom:-10px;width:55%;height:145px;object-fit:cover;border-radius:35px 0 0 0}.btn{border:0;border-radius:22px;padding:11px 18px;background:var(--g);color:#32113d;font-weight:bold}.section{padding:15px}.chips{display:flex;gap:8px;overflow:auto}.chip{background:#fff;border:1px solid #eee;border-radius:18px;padding:9px 12px;white-space:nowrap}.chip.active{background:var(--p);color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px #ddd}.card img{width:100%;height:125px;object-fit:cover}.card .pad{padding:10px}.price{color:var(--p);font-weight:800;font-size:18px}.small{font-size:12px;color:#666}.add{width:100%;margin-top:8px;border:0;background:var(--p);color:white;border-radius:18px;padding:8px;font-weight:bold}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 4px;z-index:20}.nav div{text-align:center;font-size:11px;color:#555}.nav b{display:block;font-size:19px;color:var(--p)}.page{padding-bottom:75px}.detailImg{width:100%;height:310px;object-fit:cover}.detail{background:#fff;border-radius:22px 22px 0 0;margin-top:-18px;position:relative;padding:18px}.qty{display:flex;align-items:center;gap:20px;justify-content:center;margin:18px}.circle{border:1px solid #ddd;border-radius:50%;width:34px;height:34px;background:#fff}.wide{width:100%;padding:14px;border:0;border-radius:24px;background:var(--p);color:white;font-weight:bold;font-size:16px}.cartrow{display:flex;gap:10px;background:#fff;border-radius:12px;padding:10px;margin-bottom:8px}.cartrow img{width:70px;height:70px;object-fit:cover;border-radius:8px}.grow{flex:1}.total{background:#fff;padding:14px;border-radius:12px}.input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0}.success{text-align:center;padding:40px 20px;background:white;min-height:70vh}.check{font-size:60px;color:#6a0aa0}.menu{background:linear-gradient(160deg,#3a0750,#681083);color:white;min-height:75vh;padding:20px}.menu a{display:block;color:white;text-decoration:none;padding:14px;border-radius:8px}.menu a:hover{background:#7b1795}.toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:#222;color:white;padding:10px 15px;border-radius:20px;display:none;z-index:30}
</style></head><body><div class="app" id="app"></div><div class="toast" id="toast">Added to cart</div>
<script>
const P=[
{id:1,n:'Nice Peanut Chikki',p:50,u:'50 pcs (Packet)',c:'Kadalai Mittai',img:'images/peanut.jpg',d:'Crispy and tasty peanut chikki made with premium quality peanuts and pure jaggery.'},
{id:2,n:'Peanut Chikki',p:75,u:'75 pcs (Packet)',c:'Kadalai Mittai',img:'images/peanut2.jpg',d:'Traditional peanut chikki with rich jaggery taste.'},
{id:3,n:'Ellu Chikki',p:60,u:'50 pcs (Jar)',c:'Ellu Mittai',img:'images/ellu.jpg',d:'Crunchy sesame chikki made with quality sesame and jaggery.'},
{id:4,n:'Mysore Pak',p:80,u:'250g (Pack)',c:'Mysore Pak',img:'images/mysore.jpg',d:'Soft, rich traditional Mysore Pak.'},
{id:5,n:'Nice Peanut Chikki Jar',p:150,u:'50 pcs (Jar)',c:'Kadalai Mittai',img:'images/peanut.jpg',d:'Premium jar pack for gifting and family sharing.'},
{id:6,n:'Peanut Chikki Cone Jar',p:150,u:'50 pcs (Jar)',c:'Kadalai Mittai',img:'images/peanut2.jpg',d:'Traditional taste in a convenient jar.'}
];
let cart=JSON.parse(localStorage.getItem('cart')||'[]');let page='home';let selected=null;
function save(){localStorage.setItem('cart',JSON.stringify(cart))} function count(){return cart.reduce((a,x)=>a+x.q,0)} function money(n){return '₹'+n}
function img(p){return `<img src="${p.img}" onerror="this.src='images/peanut.jpg'">`}
function header(){return `<div class=top><div class=toprow><span class=hamb onclick="page='menu';render()">☰</span><img class=logo src="images/logo.jpg"><span class=cart onclick="page='cart';render()">🛒<sup>${count()}</sup></span></div>${page==='home'?'<div class=search>Search for sweets... 🔍</div>':''}</div>`}
function nav(){return `<div class=nav><div onclick="page='home';render()"><b>⌂</b>Home</div><div onclick="page='products';render()"><b>▦</b>Products</div><div onclick="page='cart';render()"><b>🛒</b>Cart</div><div onclick="page='orders';render()"><b>▤</b>Orders</div><div onclick="page='menu';render()"><b>☰</b>More</div></div>`}
function add(id){let x=cart.find(a=>a.id===id);if(x)x.q++;else cart.push({id,q:1});save();toast('Added to cart');render()}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1300)}
function home(){return `<div class=page>${header()}<div class=hero><h1>Pure Ingredients<br>Traditional Taste<br>Premium Quality</h1><p>Ayyanar Sweets</p><button class=btn onclick="page='products';render()">Shop Now →</button><img src="images/peanut.jpg"></div><div class=section><div class=chips><span class=chip onclick="page='products';render()">▦ All Products</span><span class=chip>🍬 Chikki</span><span class=chip>⬜ Purfi</span><span class=chip>🟨 Mysore Pak</span></div><h3>Our Best Sellers <small style=float:right;color:var(--p)>View All →</small></h3><div class=grid>${P.slice(0,4).map(x=>`<div class=card onclick="selected=${x.id};page='detail';render()">${img(x)}<div class=pad><b>${x.n}</b><div class=price>${money(x.p)}</div></div></div>`).join('')}</div></div>${nav()}</div>`}
function products(){return `<div class=page>${header()}<div class=section><div class=chips><span class=chip active>All</span><span class=chip>Kadalai Mittai</span><span class=chip>Ellu Mittai</span><span class=chip>Purfi</span><span class=chip>Mysore Pak</span></div><h3>Products</h3><div class=grid>${P.map(x=>`<div class=card>${img(x)}<div class=pad><b>${x.n}</b><div class=price>${money(x.p)}</div><div class=small>${x.u}</div><button class=add onclick="add(${x.id})">Add</button></div></div>`).join('')}</div></div>${nav()}</div>`}
function detail(){let x=P.find(a=>a.id===selected)||P[0];return `<div class=page><div class=top><div class=toprow><span onclick="page='products';render()">←</span><b style=margin:auto>Product Details</b><span>♡</span></div></div>${img(x).replace('<img','<img class=detailImg')}<div class=detail><h2>${x.n}</h2><div><span class=price>${money(x.p)}</span> &nbsp; <span>${x.u}</span></div><p>${x.d}</p><div class=qty><button class=circle onclick="toast('Quantity updated')">−</button><b>1</b><button class=circle onclick="toast('Quantity updated')">+</button></div><button class=wide onclick="add(${x.id})">🛒 Add to Cart</button><div style="display:flex;justify-content:space-around;padding:22px 0;font-size:12px"><span>♢<br>Pure Ingredients</span><span>⊘<br>No Preservatives</span><span>♧<br>Traditional Taste</span></div></div>${nav()}</div>`}
function cartPage(){let sub=cart.reduce((a,x)=>a+(P.find(p=>p.id===x.id).p*x.q),0),del=sub?30:0;return `<div class=page>${header()}<div class=section><h2>My Cart</h2>${cart.length?cart.map(x=>{let p=P.find(a=>a.id===x.id);return `<div class=cartrow>${img(p)}<div class=grow><b>${p.n}</b><div class=price>${money(p.p)}</div><button class=circle onclick="xq(${p.id},-1)">−</button> ${x.q} <button class=circle onclick="xq(${p.id},1)">+</button></div><span onclick="removeItem(${p.id})">🗑</span></div>`}).join(''):'<p>Your cart is empty.</p>'}<div class=total><div>Subtotal <b style=float:right>${money(sub)}</b></div><div>Delivery Charge <b style=float:right>${money(del)}</b></div><hr><h3>Total <b style=float:right>${money(sub+del)}</b></h3><button class=wide onclick="page='checkout';render()" ${!cart.length?'disabled':''}>Proceed to Checkout</button></div></div>${nav()}</div>`}
function xq(id,d){let x=cart.find(a=>a.id===id);if(x){x.q+=d;if(x.q<=0)cart=cart.filter(a=>a.id!==id);save();render()}}function removeItem(id){cart=cart.filter(a=>a.id!==id);save();render()}
function checkout(){let sub=cart.reduce((a,x)=>a+(P.find(p=>p.id===x.id).p*x.q),0),total=sub+30;return `<div class=page><div class=top><div class=toprow><span onclick="page='cart';render()">←</span><b style=margin:auto>Checkout</b></div></div><div class=section><h3>📍 Delivery Address</h3><div class=card style=padding:12px><b>Customer</b><br>Rajaman Nagar Housing Board Colony<br>Madurai - 625009</div><h3>Payment Method</h3><div class=card style=padding:12px><p>◉ Cash on Delivery</p><p>○ Online Payment (UPI / Card)</p><p>🟢 WhatsApp Order (Pay on Delivery)</p></div><h3>Order Summary</h3><div class=total>Subtotal <b style=float:right>${money(sub)}</b><br><br>Delivery Charge <b style=float:right>₹30</b><hr><h3>Total Amount <b style=float:right>${money(total)}</b></h3></div><button class=wide style="margin-top:14px" onclick="placeOrder()">Place Order</button></div></div>`}
function placeOrder(){let id='AS'+Math.floor(100000+Math.random()*900000);let sub=cart.reduce((a,x)=>a+(P.find(p=>p.id===x.id).p*x.q),0);localStorage.setItem('lastOrder',JSON.stringify({id,total:sub+30,date:new Date().toLocaleString()}));cart=[];save();page='success';selected=id;render()}
function success(){let o=JSON.parse(localStorage.getItem('lastOrder')||'{}');return `<div class=success><img class=logo src="images/logo.jpg"><div class=check>✓</div><h2>Order Placed Successfully!</h2><p>Thank you for choosing Ayyanar Sweets.<br>Your order has been received.</p><div class=card style=padding:14px><b>Order ID</b><br>#${o.id||'AS123456'}<br><br><b>Total Amount</b><br>${money(o.total||0)}</div><button class=wide style="margin-top:15px" onclick="page='home';render()">Continue Shopping</button><a class=wide style="display:block;text-decoration:none;text-align:center;margin-top:10px;background:white;color:var(--p);border:1px solid var(--p)" href="https://wa.me/919876543210?text=Hello%20Ayyanar%20Sweets%2C%20my%20order%20ID%20is%20${o.id||''}">🟢 Continue with WhatsApp</a></div>`}
function menu(){return `<div class=page><div class=menu><img class=logo src="images/logo.jpg"><h3>Guest User</h3><p>Welcome to Ayyanar Sweets</p>${['Home','Products','Cart','Orders','My Address','Offers & Notifications','Contact Us','About Us','Settings'].map((x,i)=>`<a href="#" onclick="page='${['home','products','cart','orders','menu','menu','contact','menu','menu'][i]}';render();return false">${['⌂','▦','🛒','▤','⌖','♢','☎','ⓘ','⚙'][i]} &nbsp; ${x}</a>`).join('')}<hr><center>Traditional in Every Bite</center></div>${nav()}</div>`}
function orders(){let o=localStorage.getItem('lastOrder');return `<div class=page>${header()}<div class=section><h2>Orders</h2>${o?'<div class=card style=padding:15px><b>Latest Order</b><p>Order ID: #'+JSON.parse(o).id+'</p><p>Total: '+money(JSON.parse(o).total)+'</p><span style="color:green">Order received</span></div>':'<p>No orders yet.</p>'}</div>${nav()}</div>`}
function contact(){return `<div class=page>${header()}<div class=section><h2>Contact Us</h2><div class=card style=padding:18px><h3>Ayyanar Sweets</h3><p>📞 +91 98765 43210</p><p>📍 Rajaman Nagar Housing Board Colony, Madurai - 625009</p><a class=wide style="display:block;text-decoration:none;text-align:center" href="https://wa.me/919876543210">Chat on WhatsApp</a></div></div>${nav()}</div>`}
function render(){document.getElementById('app').innerHTML=page==='home'?home():page==='products'?products():page==='detail'?detail():page==='cart'?cartPage():page==='checkout'?checkout():page==='success'?success():page==='orders'?orders():page==='contact'?contact():menu();window.scrollTo(0,0)}render();
</script></body></html>
